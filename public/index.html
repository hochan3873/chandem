  <link rel="stylesheet" href="/css/style.css">
  <link rel="preload" as="image" href="/img/splash2.webp">
  <script>
    // 로딩 화면 + "화면을 터치해서 시작": 새로 열 때마다 (첫 터치로 배경음악을 틀려고).
    //  · 이 탭에서 이미 소리를 풀었으면(gw:audioOK) 숨긴 채로 조용히 소리 풀기를 먼저 해 보고, 안 될 때만 보여 줌 (splash-quiet)
    //  · 전에 와 본 사람은 진행 막대 없이 바로 터치 화면 (splash-fast)
    //  · ?nosplash · 자동 테스트(webdriver)면 건너뜀 (?splash 로 강제 표시)
    (function () {
      var h = document.documentElement, q = location.search;
      try {
        var skip = /[?&]nosplash\b/.test(q) || (navigator.webdriver && !/[?&]splash\b/.test(q));
        h.classList.add(skip ? 'no-splash' : 'splashing');
        if (!skip && sessionStorage.getItem('gw:audioOK')) h.classList.add('splash-quiet');
        if (!skip && localStorage.getItem('gw:seenSplash')) h.classList.add('splash-fast');
      } catch (e) { h.classList.add('no-splash'); }
    })();
  </script>

<body>
  <div id="splash" role="button" tabindex="0" aria-label="찬이의 게임월드 · 화면을 터치해서 시작">

    <img class="sp-icon" src="/img/gw2-icon-512.png" alt="">

    <div class="sp-bottom">
      <div class="sp-bar"><i></i></div>
      <div class="sp-meta"><span data-sp-what>준비하는 중…</span><span data-sp-pct>0%</span></div>
      <div class="sp-go">화면을 터치해서 시작</div>
      <p class="sp-tip" data-sp-tip>팁: 친구에게 초대 링크만 보내면 가입 없이 바로 같이 놀 수 있어요</p>
      <p class="sp-fine">칩과 코인은 현금 가치가 없는 친목용 점수예요</p>
    </div>
  </div>
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/splash.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
