<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a22">
  <meta name="description" content="찬이의 게임월드 — 친구들과 휴대폰으로 즐기는 홀덤 · 섯다 · 오목 (칩은 현금 가치 없는 친목용 점수)">
  <title>찬이의 게임월드</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="찬이의 게임월드">
  <meta property="og:title" content="찬이의 게임월드 · 홀덤 · 섯다 · 오목">
  <meta property="og:description" content="링크만 누르면 바로 참가! 가입 없이 휴대폰으로 친구들과 홀덤 · 섯다 · 오목 한 판 ♠">
  <meta property="og:image" content="https://chandem.onrender.com/img/og-gw2.jpg">
  <meta property="og:url" content="https://chandem.onrender.com/">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="찬이의 게임월드">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/img/gw-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/gw-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@700;900&family=Black+Han+Sans&family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preload" as="image" href="/img/splash.webp">
  <script>
    // 첫 로딩 화면: 한 세션에 한 번만. ?nosplash · 자동 테스트(webdriver)면 건너뜀 (?splash 로 강제 표시)
    (function () {
      var h = document.documentElement, q = location.search;
      try {
        var skip = /[?&]nosplash\b/.test(q) || (navigator.webdriver && !/[?&]splash\b/.test(q)) || sessionStorage.getItem('gw:splashed');
        h.classList.add(skip ? 'no-splash' : 'splashing');
      } catch (e) { h.classList.add('no-splash'); }
    })();
  </script>
</head>
<body>
  <div id="splash" role="button" tabindex="0" aria-label="찬이의 게임월드 · 화면을 터치해서 시작">
    <div class="sp-art"></div>
    <img class="sp-icon" src="/img/gw-icon-512.png" alt="">
    <div class="sp-logo"><span class="logo-pop sp-title" data-text="찬이의 게임월드">찬이의 게임월드</span><span class="sp-en">CHAN'S GAME WORLD</span></div>
    <div class="sp-bottom">
      <div class="sp-bar"><i></i></div>
      <div class="sp-meta"><span data-sp-what>준비하는 중…</span><span data-sp-pct>0%</span></div>
      <div class="sp-go">화면을 터치해서 시작</div>
      <p class="sp-tip" data-sp-tip>팁: 친구에게 초대 링크만 보내면 가입 없이 바로 같이 놀 수 있어요</p>
      <p class="sp-fine">칩과 코인은 현금 가치가 없는 친목용 점수예요</p>
    </div>
  </div>
  <div id="app" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/splash.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
