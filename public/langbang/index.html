  <script>
    // 카카오톡에서 열면 크롬(안드로이드) · 사파리(아이폰 기본 브라우저)로 바로 넘긴다 — 카톡 안에서는 앱 설치가 안 되고 화면이 꺼지면 자주 끊겨서
    // 넘어간 브라우저는 주소의 ?from=kakao 를 보고 설치 안내를 띄운다 (install.js) · 「그냥 카카오톡에서 할게요」 는 이 탭 동안 기억
    (function () {
      var ua = navigator.userAgent || '';
      if (!/KAKAOTALK/i.test(ua)) return;
      try { if (sessionStorage.getItem('chandem:stayKakao')) return; } catch (e) {}
      var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(ua);
      var u = new URL(location.href); u.searchParams.set('from', 'kakao');
      var to = android ? 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=https;S.browser_fallback_url=' + encodeURIComponent(u.toString()) + ';end' // 앱이 깔려 있으면 앱으로, 없으면 기본 브라우저
        : 'kakaotalk://web/openExternal?url=' + encodeURIComponent(u.toString());
      var name = ios ? '사파리' : '크롬';
      var el = document.createElement('div');
      el.id = 'kakao-out';
      el.setAttribute('style', 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 30%,#2a2050,#0b0a16 70%);color:#fff4e4;font-family:Pretendard Variable,Noto Sans KR,sans-serif;text-align:center');
      el.innerHTML = '<div style="width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:12px">'
        + '<img src="/img/lb/app/icon-192.png" alt="" width="64" height="64" style="border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.5)">'
        + '<h2 style="margin:4px 0 0;font-size:1.3rem;color:#ffe08a">' + (android ? '앱(없으면 크롬)으로' : name + '로') + ' 여는 중이에요</h2>'
        + '<p style="margin:0;line-height:1.55;font-size:.92rem">카카오톡 안에서는 <b>앱 설치가 안 되고</b> 화면이 꺼지면 자주 끊겨요. 그래서 <b>' + name + '</b>로 옮겨서 열어요.</p>'
        + '<button type="button" data-ko="go" style="width:100%;padding:14px;border:0;border-radius:14px;font:inherit;font-weight:900;font-size:1.05rem;background:linear-gradient(180deg,#ffe08a,#d9a640);color:#2a1600">' + (android ? '앱 · 브라우저로 열기' : name + '로 열기') + '</button>'
        + '<p style="margin:0;font-size:.78rem;opacity:.75">안 넘어가면 오른쪽 아래 <b>' + (ios ? '⋯' : '⋮') + '</b> → <b>「다른 브라우저로 열기」</b>' + (android ? ' → 크롬 · 랑방 대전 앱이 깔려 있으면 앱이 바로 열려요' : '') + '</p>'
        + '<button type="button" data-ko="stay" style="margin-top:6px;padding:8px 12px;border:0;background:none;color:#fff4e4;opacity:.65;font:inherit;font-size:.85rem">그냥 카카오톡에서 할게요</button></div>';
      document.body.appendChild(el);
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-ko]'); if (!b) return;
        if (b.getAttribute('data-ko') === 'go') location.href = to;
        else { try { sessionStorage.setItem('chandem:stayKakao', '1'); } catch (x) {} el.remove(); }
      });
      setTimeout(function () { location.href = to; }, 150);
    })();
  </script>
  <div id="stage">
    <canvas id="cv"></canvas>
    <!-- 부팅 로딩: 첫 화면부터 로비가 다 준비될 때까지 (그림 · 글꼴 · 계정) -->
    <div id="bootld" class="bootld" aria-live="polite">
      <img class="bl-bg" src="/img/lb/title_poster.jpg?v=3" alt="" fetchpriority="high">
      <script>/* 시즌 테마(할로윈 등) 기간이면 지난번에 적어 둔 시즌 포스터로 (season.js syncHub) */try{var sa=JSON.parse(localStorage.getItem('langbang:seasonArt')||'null');if(sa&&sa.poster&&/^\/img\/lb\/season\/[a-z0-9_]+\.webp(\?v=\d+)?$/.test(sa.poster)&&Date.now()<Number(sa.until))document.querySelector('#bootld .bl-bg').src=sa.poster;}catch(e){}</script>

        <p id="bl-tip" class="bl-tip">속성 상성이 맞으면 피해가 두 배!</p>
      </div>
    </div>

    <!-- 게임 중 HUD -->
    <div id="hud" hidden>
      <div class="hellvibe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="hud-top">
        <div class="hl"><button id="btn-pause" class="icon-btn" aria-label="일시정지">❚❚</button><span id="h-time" class="h-time">0:00</span></div>
        <div class="wave-box">
          <b id="h-wave">WAVE 1</b>
          <small><span id="h-left">남은 진상 0</span> <span id="h-fx" class="hfx" data-act="fxInfo"></span></small>
        </div>
        <div class="stat-box">
          <span class="kill" id="h-kills">0</span>
          <span class="score" id="h-score">0</span>
        </div>
        <div class="hr"><button id="btn-auto" class="speed-pill auto-pill" hidden aria-label="무한 도전 자동">자동</button><button id="btn-speed" class="speed-pill" hidden>×1</button><button id="btn-mute" class="icon-btn" aria-label="소리">🔊</button></div>
      </div>
      <div class="xp-bar"><div id="h-xp"></div><span id="h-lv">Lv.1</span></div>
      <div id="h-syn" class="h-syn"></div>
      <div id="oppstrip" class="oppstrip" hidden></div>
      <div id="bossbar" hidden>
        <span id="boss-name">보스</span>
        <div class="bb"><div id="boss-fill"></div></div>
      </div>
      <div id="oppcard" class="oppcard" hidden></div>
      <div id="skillbar"></div>
      <div class="hud-bottom">
        <div class="base-hp">
          <span class="base-ico"><img src="/img/lb/base.webp" alt="" onerror="this.remove()"></span>
          <div class="hp-wrap">
            <div class="hp-label"><b>랑방 입구 <span id="h-stars" class="hstars">★★★</span></b><span id="h-hptext">300 / 300</span></div>
            <div class="hp-bar"><div id="h-hp-lag"></div><div id="h-hp"></div></div>
          </div>
        </div>
        <button id="btn-send" class="send-btn" hidden>📤 보내기</button>
        <button id="btn-ult" class="ult v2" aria-label="총력전 (기세 2칸)">
          <svg class="ult-ring" viewBox="0 0 100 100" aria-hidden="true"><g class="ur-bg"><path d="M55.6 4.3 A46 46 0 0 1 55.6 95.7"/><path d="M44.4 95.7 A46 46 0 0 1 44.4 4.3"/></g><g class="ur-fg"><path id="ur0" d="M55.6 4.3 A46 46 0 0 1 55.6 95.7" pathLength="100"/><path id="ur1" d="M44.4 95.7 A46 46 0 0 1 44.4 4.3" pathLength="100"/></g></svg>
          <span class="ult-rays"></span>
          <span class="ult-gem"><i class="ult-fill"></i><img class="ult-ico" src="/img/lb/ui2/team_emblem.webp" alt="" draggable="false"></span>
          <span class="ult-txt">총력전</span>
        </button>
      </div>
      <div id="tip" hidden></div>
    </div>

    <!-- 메뉴·카드·결과 화면 -->
    <div id="aimbar" hidden><b>찍을 곳을 탭!</b><button data-aim="x">취소</button></div>
    <div id="bubble" hidden></div>
    <div id="ui"></div>
    <div id="toast" hidden></div>
